<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Gear (top-right) -->
  <g transform="translate(100,90)" fill="currentColor">
    <path d="M50,-20 A55,55 0 1,1 50,20 L38,14 A42,42 0 1,0 38,-14 Z" opacity="0.9"/>
    <!-- Gear teeth -->
    <rect x="45" y="-8" width="18" height="16" rx="3"/>
    <rect x="-63" y="-8" width="18" height="16" rx="3"/>
    <rect x="-8" y="45" width="16" height="18" rx="3"/>
    <rect x="-8" y="-63" width="16" height="18" rx="3"/>
    <rect x="30" y="30" width="16" height="16" rx="3" transform="rotate(45,38,38)"/>
    <rect x="-46" y="30" width="16" height="16" rx="3" transform="rotate(-45,-38,38)"/>
    <rect x="30" y="-46" width="16" height="16" rx="3" transform="rotate(-45,38,-38)"/>
    <rect x="-46" y="-46" width="16" height="16" rx="3" transform="rotate(45,-38,-38)"/>
    <!-- Inner gear hole -->
    <circle cx="0" cy="0" r="28" fill="transparent" stroke="currentColor" stroke-width="3"/>
  </g>

  <!-- Brain/dome shape with dots -->
  <g transform="translate(84,90)" fill="currentColor">
    <!-- Dome outline -->
    <path d="M0,40 Q-45,40 -45,-5 Q-45,-55 0,-55 Q45,-55 45,-5 Q45,40 0,40 Z" opacity="0.0" stroke="currentColor" stroke-width="5" fill="none"/>
    <!-- Dots pattern inside dome (neural network) -->
    <circle cx="-22" cy="-30" r="5"/>
    <circle cx="0" cy="-38" r="5"/>
    <circle cx="22" cy="-30" r="5"/>
    <circle cx="-30" cy="-8" r="5"/>
    <circle cx="-10" cy="-15" r="5"/>
    <circle cx="10" cy="-15" r="5"/>
    <circle cx="30" cy="-8" r="5"/>
    <circle cx="-20" cy="12" r="5"/>
    <circle cx="0" cy="5" r="5"/>
    <circle cx="20" cy="12" r="5"/>
    <circle cx="-10" cy="28" r="5"/>
    <circle cx="10" cy="28" r="5"/>
  </g>

  <!-- Wheat/laurel branches (left side) -->
  <g transform="translate(52,108)" stroke="currentColor" stroke-width="3" fill="none">
    <path d="M0,0 Q-28,-30 -35,-65"/>
    <ellipse cx="-12" cy="-18" rx="8" ry="5" transform="rotate(-30,-12,-18)" fill="currentColor"/>
    <ellipse cx="-20" cy="-35" rx="8" ry="5" transform="rotate(-25,-20,-35)" fill="currentColor"/>
    <ellipse cx="-27" cy="-52" rx="7" ry="4" transform="rotate(-20,-27,-52)" fill="currentColor"/>
  </g>

  <!-- Diamond with arrow (bottom center) -->
  <g transform="translate(100,162)">
    <rect x="-22" y="-22" width="44" height="44" rx="5" transform="rotate(45)" fill="currentColor"/>
    <!-- Arrow up inside diamond -->
    <path d="M0,-13 L0,8 M-8,-3 L0,-13 L8,-3" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Orbit ring -->
    <ellipse cx="0" cy="5" rx="12" ry="4" stroke="white" stroke-width="2" fill="none"/>
  </g>
</svg>
